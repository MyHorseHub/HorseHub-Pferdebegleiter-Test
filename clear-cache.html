<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HorseHub Cache-Reset</title><body style="font-family:system-ui;padding:24px;background:#111;color:#eee"><h2>HorseHub wird aktualisiert …</h2><p id="s">Alten Service Worker wird entfernt.</p><script>(async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.unregister()));try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('horsehub-')).map(k=>caches.delete(k)))}catch(e){}document.getElementById('s').textContent='Cache entfernt. App wird neu geladen …';setTimeout(()=>location.replace('./?cache-reset=1550'),500)}catch(e){document.getElementById('s').textContent='Bitte App neu laden: '+e.message}})()</script></body></html>
